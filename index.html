<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 高数下册图像化学习助手</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
    <link rel="stylesheet" href="custom.css">
    
    <!-- MathJax 3 配置（最简化） -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
    <div id="app">加载中...</div>
    <script>
        // 定义一个通用的公式渲染函数
        function renderMath() {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch(err => console.warn('MathJax渲染失败:', err));
            }
        }

        // 方案1：Docsify 插件钩子
        window.$docsify = {
            name: '🎨 高数下册图像化学习助手',
            repo: 'https://github.com/psittacine2007/math-learning-assistant',
            loadSidebar: false,   // 如需要侧边栏改为 true
            subMaxLevel: 3,
            search: {
                placeholder: '搜索知识点...',
                noData: '没有找到相关内容',
                depth: 3
            },
            plugins: [
                function(hook, vm) {
                    // 每次页面切换完成后执行
                    hook.doneEach(function() {
                        // 延迟足够时间，确保新 DOM 已完全插入
                        setTimeout(renderMath, 500);
                    });
                }
            ]
        };

        // 方案2：监听 hash 变化（后备方案，确保切换页面后一定渲染）
        window.addEventListener('hashchange', function() {
            setTimeout(renderMath, 300);
        });

        // 页面完全加载后也渲染一次（针对初始加载）
        window.addEventListener('load', function() {
            setTimeout(renderMath, 500);
        });
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
