<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 高数下册图像化学习助手</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <div id="app">加载中...</div>
    <script>
        window.$docsify = {
            name: '🎨 高数下册图像化学习助手',
            repo: 'https://github.com/psittacine2007/math-learning-assistant',
            loadSidebar: false,        // 如果你不需要侧边栏，保持 false；如果需要，改为 true 并确保 _sidebar.md 存在
            subMaxLevel: 3,
            search: {
                placeholder: '搜索知识点...',
                noData: '没有找到相关内容',
                depth: 3
            }
        }
    </script>
    <!-- 先加载 docsify 核心 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
    <!-- 加载搜索插件 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!-- 加载 mathjax 插件（自动处理公式渲染） -->
    <script src="//cdn.jsdelivr.net/npm/docsify-mathjax@3/dist/docsify-mathjax.js"></script>
</body>
</html>
