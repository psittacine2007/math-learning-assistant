<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 高数下册图像化学习助手</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
    <link rel="stylesheet" href="custom.css">
    
    <!-- 手动加载 MathJax（最稳定） -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
    <div id="app">加载中...</div>
    <script>
        window.$docsify = {
            name: '🎨 高数下册图像化学习助手',
            repo: 'https://github.com/psittacine2007/math-learning-assistant',
            loadSidebar: false,      // 如需侧边栏改为 true，并创建 _sidebar.md
            subMaxLevel: 3,
            search: {
                placeholder: '搜索知识点...',
                noData: '没有找到相关内容',
                depth: 3
            },
            plugins: [
                function(hook, vm) {
                    // 每次页面切换完成后，重新渲染公式
                    hook.doneEach(function() {
                        // 确保 DOM 更新完成
                        setTimeout(function() {
                            if (window.MathJax && MathJax.typesetPromise) {
                                MathJax.typesetPromise().catch(err => console.warn('MathJax错误:', err));
                            }
                        }, 300);
                    });
                }
            ]
        }
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
